plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dev.flutter.flutter-gradle-plugin'
}

android {
    namespace "com.miha.translate"
    compileSdkVersion flutter.compileSdkVersion

    lintOptions {
        disable 'InvalidPackage'
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId 'com.miha.translate'
        // Flutter 3.47.5 hard-errors below 23 (DependencyVersionChecker
        // errorMinSdkVersion) and its build migrator rewrites any literal value
        // from 16-23 to flutter.minSdkVersion, which is 24. 24 is therefore the
        // real floor; stating it explicitly keeps the migrator from rewriting
        // this file on every build. Raised from 21: drops Android 5.0-6.0.
        minSdkVersion 24
        targetSdkVersion 33
        versionCode 13
        versionName '1.4.4'
    }


    flavorDimensions 'deploy'

    productFlavors {
        development {
            dimension 'deploy'
        }
        github {
            dimension 'deploy'
        }
        fdroid {
            dimension 'deploy'
        }
    }

    android.applicationVariants.all { variant ->
        if (variant.flavorName == 'fdroid') {
            variant.outputs.all { output ->
                output.outputFileName = 'app-fdroid-release.apk'
            }
        }
    }
}

flutter {
    source '../..'
}
