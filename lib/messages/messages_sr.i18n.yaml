main:
  about: "O aplikaciji"
  about_story_title: "Kako je sve počelo"
  about_story_text: "Miha Translate nastao je iz jednostavne potrebe: da moji klijenti imaju pouzdanu aplikaciju za prevođenje koja radi kada im zatreba.\n\nPrvobitni plan nije bio da razvijam sopstveni prevodilac.\n\nMeđutim, kada postojeće aplikacije prestanu da rade, a njihovi developeri baš i ne žure da otklone probleme, čoveku ne preostaje mnogo izbora.\n\nMogao sam da čekam ažuriranje.\nMogao sam ponovo da prijavim isti problem.\nA mogao sam i da napravim svoju aplikaciju.\n\nPogodite šta sam izabrao. 🙂"
  about_how_title: "Kako funkcioniše"
  about_how_text: "Miha Translate je jednostavna Android aplikacija za prevođenje teksta, razvijena pomoću Flutter tehnologije.\n\nAplikacija automatski prevodi tekst tokom unosa, podržava prepoznavanje izvornog jezika, izbor i zamenu jezika, reprodukciju govora i kopiranje prevedenog teksta.\n\nZa prevođenje koristi Googleov onlajn servis, bez potrebe da Google Translate aplikacija bude instalirana na uređaju.\n\nInterfejs podržava svetlu i tamnu temu i prilagođava se različitim veličinama ekrana.\n\nZa prevođenje je potrebna internet veza."
  about_footer: "Napravljeno za MihaSecure zajednicu."
  about_license_text: "Miha Translate je slobodan softver, objavljen pod licencom GNU General Public License, verzija 3. Zasnovan je na aplikaciji SimplyTranslate Mobile, čiji su autori ManeraKai i saradnici."
  about_licenses_button: "Licence otvorenog koda"
